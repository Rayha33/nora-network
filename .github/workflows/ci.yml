name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Validate data and streams
        run: nora validate
      - name: Test
        run: pytest -q
      - name: JS tests
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run JS tests
        run: node --test "tests/js/*.test.mjs"
      - name: Build site
        run: nora build --out site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 14
