# Publishes the site to GitHub Pages (the gh-pages branch) on every push to main.
# PR previews live in gh-pages/pr-preview/ and are left alone here.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Every check CI runs (tests/test_setup.py keeps the two in step): a change that
      # breaks one never reaches the site, even when it is pushed straight to main.
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Validate data and streams
        run: nora validate
      - name: Test
        run: pytest -q
      - name: JS tests
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run JS tests
        run: node --test "tests/js/*.test.mjs"
      - name: Build site
        run: nora build --out site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
