# Builds the site into the gh-pages branch on every push to main. factorlab.app/nora-network/
# copies that branch every 10 minutes and is the only place NORA is published (Ray, 29 Oct:
# "remove all nora related websites except the application on factorlab.app/nora-network").
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Every check CI runs (tests/test_setup.py keeps the two in step): a change that
      # breaks one never reaches the site, even when it is pushed straight to main.
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Validate data and streams
        run: nora validate
      - name: Test
        run: pytest -q
      - name: JS tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run JS tests
        run: node --test "tests/js/*.test.mjs"
      - name: Build site
        run: nora build --out site
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
