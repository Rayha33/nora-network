# Builds every pull request into its own preview site and comments the link on the PR:
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# Removed again when the PR closes. Runs for branches in this repository; pull requests
# from forks get the built site as a downloadable artifact from the CI workflow instead.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
          cache: pip
      - if: github.event.action != 'closed'
        run: pip install -e . && nora build --out site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: site
