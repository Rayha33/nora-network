# NORA settings: what everyone sees on a fresh visit, and the limits behind every alarm.
# Visitors can change the display settings in the app (settings button) and share them
# as a link; the thresholds and pressure windows here are the same for everyone.
# Unknown keys and bad values fail `nora validate` with a suggestion.

[screen]
start = "overview"          # overview or network
network_view = "map"        # map or flow
network_mode = "live"       # live, load, risk or plain
theme = "light"             # light, dark or auto (follows the device); the button switches
autoplay = true             # start playing the data when the page opens (?autoplay=0 to stop)
speed = 600                 # default playback: data seconds per real second (10 min/s: a peak crosses a line in about a minute)
now_in_middle = true        # synthetic data is re-timed in the browser so now sits mid-timeline: history left, model right
display = "auto"            # auto (from the window), desk, wall (video wall: large, dark, kiosk) or compact; ?display= and Settings override

[labels]
names = true
line_values = "auto"        # auto (shown in live, load and risk), on, off

[assets]
hide = []                   # asset types to leave out, e.g. ["market", "lng"]
grid_entries = true         # notional onshore entries into the national grids

[flow]
direction = "vertical"      # vertical (top to bottom), horizontal, or auto (follows the screen)
density = "comfortable"     # compact, comfortable or spacious
animation = true            # flow bands in and out of the nodes (pigs and peaks always show)
# Node ids drawn on the Map but not in the Flow view: Poland VTP (Ray, 29 Oct) and the
# detailed fields that appear only when the map is zoomed in (data/nodes.csv map_min_zoom).
hide = [
    "pl_vtp", "smorbukk_nord", "mikkel", "morvin", "trestakk", "skarv", "aerfugl", "draugen",
    "tordis", "gullfaks_sor",
]
watch = ["sleipner", "draupner_s", "draupner_e"]  # their pressure's change per hour always shows (Ray: "especially in and out of SLR, DRP S and DRP E")

# Alarm thresholds. Three priorities: warning (amber), medium (orange), critical (red).
[thresholds]
load = [1.01, 1.05, 1.10]             # share of capacity in use: running full is normal
nomination = [0.03, 0.06, 0.10]       # |actual - nominated| / nominated at an exit point
booking = [0.95, 1.0, 1.05]           # nominated / booked capacity at an exit point
pressure_margin = [0.10, 0.05, 0.0]   # distance to a pressure limit, as a share of the window
risk = [0.05, 0.10, 0.15]             # share of deliverable gas lost if one asset trips
step = [0.15, 0.25, 0.40]             # flow change within an hour, as a share of capacity
plan_lookahead_hours = 6              # how far ahead the plan check looks
gas_day_start_utc = 5                 # the gas day runs 05:00-05:00 UTC (06:00 CET)

# Moving markers along the lines: peaks (sudden flow changes) travel with the gas,
# pigs at their own speed.
[pipelines]
gas_velocity_mps = 8.0     # how fast a change in flow travels down a pipeline
step_min = 0.10            # smallest flow change (share of capacity) shown as a peak
peak_max = 5               # peaks visible at once; the strongest are kept

# Gas quality: H2S and CO2 peaks are followed with the gas from the field to the exit
# point, diluted where other gas joins. Limits are [warning, medium, critical]; the
# critical values are common entry limits (about 5 mg/Sm3 H2S, 2.5 mol % CO2).
[quality]
h2s_ppm = [2.5, 3.0, 3.3]
co2_molpct = [2.2, 2.35, 2.5]
follow_from = 0.8          # follow a peak once a field's reading reaches 80% of its warning

# Operating pressure windows (bar) by asset type. Illustrative values for the model;
# replace them with real limits per asset when they are known.
[pressure]
field = [100, 175]        # offshore lines typically run at 120-160 bar
hub = [100, 170]
processing = [100, 165]
terminal = [55, 85]
lng = [60, 90]
storage = [50, 150]
market = [45, 80]

# Upper pressure limits (bar) by asset type: [high, high-high, integrity]. A pressure tag
# in the Flow view turns yellow at high, red at high-high and dark red at the integrity
# limit, the design pressure at the top of the window above (Ray, 29 Oct). Illustrative
# values; replace them with each asset's real alarm and trip settings when known.
[pressure_limits]
field = [160, 168, 175]
hub = [157, 163, 170]
processing = [152, 158, 165]
terminal = [76, 80, 85]
lng = [82, 86, 90]
storage = [135, 142, 150]
market = [70, 75, 80]

# The control-room palette: calm grey paper. Colour is reserved for abnormal conditions
# and alarms, so when something goes wrong it stands out at once. Never pure white:
# "active" is the lightest grey.
[colors]
paper = "#c6c9cc"        # the background
dots = "#b4b8bc"         # the paper's dot grid
water = "#b4b8bc"        # sea on the map, a step darker than land
panel = "#d4d7d9"        # panels and controls, a step lighter than the paper
inactive = "#6b7177"     # dark grey: closed, offline or no flow
normal = "#dfe2e4"       # light grey: normal state
active = "#f1f2f3"       # lightest grey: open, flowing, active
text = "#22272b"
text_dim = "#50575d"
warning = "#ffbf00"      # amber: warning (priority 3)
medium = "#ff7a1a"       # orange: medium-priority alarm (priority 2)
critical = "#e5322d"     # red: critical alarm (priority 1)
integrity = "#8e1b1b"    # dark red: a pressure at its integrity limit
h2s = "#8a7616"          # muted mustard yellow: an H2S peak moving with the gas (Ray: "H2S should be yellow")
co2 = "#93463e"          # muted brick red: a CO2 peak (Ray: "CO2 red, but not strong colors"); not alarm red
pig = "#9c8465"          # muted tan: a pig creeping along the line
peak = "#5f6d7a"          # neutral grey-blue: a change in flow moving with the gas

# The same roles on dark grey paper, for the dark theme.
[colors_dark]
paper = "#2a2e32"
dots = "#363b40"
water = "#212528"
panel = "#32373c"
inactive = "#4c5258"
normal = "#8c949b"
active = "#d5d9dc"
text = "#e1e4e6"
text_dim = "#9aa1a7"
warning = "#ffbf00"
medium = "#ff7a1a"
critical = "#ff4d47"
integrity = "#b0242a"
h2s = "#d2bd5c"
co2 = "#d48c83"
pig = "#c4ae91"
peak = "#9fb1c1"

[map]
style = "https://tiles.openfreemap.org/styles/positron"   # recoloured to the paper greys
bounds = [[-3.5, 50.2], [15.5, 67.4]]   # west, south / east, north: the whole network, Aasta Hansteen to Poland
