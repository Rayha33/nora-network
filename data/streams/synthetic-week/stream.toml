title = "A synthetic week"
description = "One week of hourly flows, pressures, hourly exit-point nominations and bookings generated from the network model, with an unplanned outage at Kollsnes and reduced capacity on Langeled. Synthetic: use it to see how live operations look, not as a record of real flows."
source = "Generated by nora.stream.synthesize from data/nodes.csv and data/pipelines.csv"
license = "MIT"
order = 1  # the stream the home page plays

[synthetic]
start = 2026-10-19T00:00:00Z
step_minutes = 60
steps = 168
seed = 7
operations = true   # also pressures, hourly nominations and bookings

[[events]]
label = "Kollsnes unplanned outage"
asset = "kollsnes"
start = 2026-10-21T06:00:00Z
end = 2026-10-21T19:00:00Z
capacity_factor = 0.0

[[events]]
label = "Langeled (south) compressor maintenance"
asset = "langeled_south"
planned = true
start = 2026-10-23T08:00:00Z
end = 2026-10-24T08:00:00Z
capacity_factor = 0.5

# Pig runs: launched into a pipeline, they travel with the gas and show on the map.
[[pigs]]
label = "Cleaning pig, Langeled (south)"
pipeline = "langeled_south"
launch = 2026-10-20T04:00:00Z
speed_mps = 4.5

[[pigs]]
label = "Inspection pig, Europipe I"
pipeline = "europipe_1"
launch = 2026-10-22T10:00:00Z
speed_mps = 3.5
