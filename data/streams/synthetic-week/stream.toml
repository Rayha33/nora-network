title = "A synthetic week"
description = "One week of hourly flows, pressures, hourly exit-point nominations and bookings generated from the network model, with an unplanned outage at Kollsnes, reduced capacity on Langeled, recurring H2S and CO2 excursions at four fields, random pressure and flow limit breaches and a pigging programme on every trunk, export line and interconnector. Synthetic: use it to see how live operations look, not as a record of real flows."
source = "Generated by nora.stream.synthesize from data/nodes.csv and data/pipelines.csv"
license = "MIT"
order = 1  # the stream the home page plays

[synthetic]
start = 2026-10-19T00:00:00Z
step_minutes = 60
steps = 168
seed = 7
operations = true   # also pressures, hourly nominations and bookings
quality = true      # also H2S and CO2 at each field, with the excursions below
composition = true  # and each field's export gas as its GC reads it: C1 to C6+, N2, O2, dew points
weather = true      # the outside air temperature at each onshore site
# A pig on every trunk, export line and interconnector, launched once a fortnight and
# staggered; with the named pigs below, about five are under way at any time (2 to 7)
# (Ray: "a few peaks and pigs going through different pipelines"). The named [[pigs]]
# below still win for their lines.
pig_programme = { every_hours = 336, speed_mps = 4.0 }
# Random limit breaches (Ray, 29 Oct: "random pressure and flow limits breached but keep
# the not too frequent. then less frequent a few of them turning red"): about two pressure
# and one flow event a day, one in five going on (briefly) to low-low, high-high or past
# the load's critical level.
breaches = { pressure_per_day = 2, flow_per_day = 1, severe_share = 0.2 }

# Gas quality excursions at fields: the reading ramps up to `peak` and holds it for
# `hours`. NORA follows each slug with the gas to the exit point.
[[synthetic.excursions]]
asset = "aasta_hansteen"
metric = "h2s_ppm"
peak = 4.6
start = 2026-10-19T02:00:00Z
hours = 3
every_hours = 30

[[synthetic.excursions]]
asset = "gudrun"
metric = "co2_molpct"
peak = 3.1
start = 2026-10-19T04:00:00Z
hours = 2   # the CO2 slugs were too long at 4 h (Ray, 29 Oct)
every_hours = 36

[[synthetic.excursions]]
asset = "troll"
metric = "h2s_ppm"
peak = 3.9
start = 2026-10-19T14:00:00Z
hours = 5
every_hours = 48

[[synthetic.excursions]]
asset = "johan_sverdrup"
metric = "co2_molpct"
peak = 2.8
start = 2026-10-20T06:00:00Z
hours = 2
every_hours = 40

[[events]]
label = "Kollsnes unplanned outage"
asset = "kollsnes"
start = 2026-10-21T06:00:00Z
end = 2026-10-21T19:00:00Z
capacity_factor = 0.0

[[events]]
label = "Langeled (south) compressor maintenance"
asset = "langeled_south"
planned = true
start = 2026-10-23T08:00:00Z
end = 2026-10-24T08:00:00Z
capacity_factor = 0.5

# Pig runs: launched into a pipeline, they travel at their own speed and show on the
# map and the Flow view. `every_hours` relaunches them: a pigging programme.
# Each has a tag, a kind and a receiving station that NORA sends synthetic messages:
# a launch notice, an ETA update every `notify_every_hours` (6 by default) and the
# arrival confirmation.
[[pigs]]
label = "Cleaning pig, Langeled (south)"
id = 3420
pipeline = "langeled_south"
tag = "PIG-LGS-014"
kind = "cleaning"
receiver = "easington"
launch = 2026-10-19T01:00:00Z
speed_mps = 4.5
every_hours = 108

[[pigs]]
label = "Inspection pig, Europipe I"
id = 3511
pipeline = "europipe_1"
tag = "PIG-EP1-031"
kind = "inspection"
receiver = "dornum"
notify_every_hours = 4
launch = 2026-10-19T03:00:00Z
speed_mps = 4.0
every_hours = 126

[[pigs]]
label = "Cleaning pig, Statpipe (rich gas)"
id = 2874
pipeline = "statpipe_rich"
kind = "cleaning"
receiver = "karsto"
launch = 2026-10-19T00:00:00Z
speed_mps = 4.0
every_hours = 72

[[pigs]]
label = "Gauging pig, Vesterled"
id = 3166
