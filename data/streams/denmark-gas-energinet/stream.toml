title = "Danish gas flows, Aug to Oct 2026"
description = "Measured daily flows through the Danish gas system from Energinet: gas arriving from the North Sea (mostly Norwegian gas through Baltic Pipe) and the onward flow to Poland. Real data for two pipelines; the rest of the chart has no readings."
source = "https://www.energidataservice.dk/tso-gas/Gasflow"
license = "Open data from Energinet's Energi Data Service; credit Energinet as the source"

# Refresh with: python scripts/fetch_energinet.py 2026-08-01 2026-10-27 data/streams/denmark-gas-energinet/raw.csv
[import]
file = "raw.csv"
layout = "wide"
timestamp = "GasDay"
timezone = "UTC"      # gas days, labelled by date
factor = 9.09e-8      # kWh per gas day -> MSm3/d, at about 11 kWh per standard cubic metre

# Energinet reports flows leaving Denmark as negative numbers; "-" flips them so they
# read as flow along the pipeline's from -> to direction.
[import.assets]
"kWhFromTyra" = ""          # Tyra is not in the network
"KWhFromNorthSea" = "baltic_pipe_ns"
"KWhToPoland" = "-baltic_pipe_east"
"KWhToDenmark" = ""        # the Danish market is not in the network
"KWhFromBiogas" = ""        # not modelled yet
"KWhToOrFromStorage" = ""   # storage sites are not in the network
"KWhToOrFromGermany" = ""   # Ellund is not in the network yet
"KWhToSweden" = ""          # Dragør is not in the network yet
