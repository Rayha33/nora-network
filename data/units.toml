# Units for level 2 (unit control): each groups the assets one operator desk looks after.
# Every node belongs to exactly one unit; a pipeline belongs to the unit it leaves from.
# Order here is the order on screen. `nora validate` checks every id.

[units.norwegian_sea]
name = "Norwegian Sea"
nodes = ["aasta_hansteen", "norne", "heidrun", "asgard", "ormen_lange", "nyhamna", "tjeldbergodden"]

[units.northern_north_sea]
name = "Northern North Sea"
nodes = [
    "gjoa", "visund", "statfjord", "gullfaks", "flags_brent", "kvitebjorn", "troll",
    "oseberg", "kollsnes", "heimdal", "beryl", "edvard_grieg", "frigg", "odin",
]

[units.hubs]
name = "Kårstø, Sleipner and Draupner"
nodes = ["karsto", "johan_sverdrup", "gudrun", "sleipner", "draupner_s", "draupner_e", "ekofisk"]

[units.uk]
name = "UK landings"
nodes = ["st_fergus", "elgin_franklin", "easington", "sns_fields", "bacton"]

[units.continent]
name = "Continental landings"
nodes = [
    "l10a", "k13a", "den_helder", "balgzand", "uithuizen", "dornum", "emden",
    "zeebrugge", "dunkirk",
]

[units.denmark_poland]
name = "Denmark and Poland"
nodes = ["baltic_tie", "nybro", "pl_vtp"]
