# Where each node sits in the Flow view: [across, down] in grid steps (one step across
# is one square's width with room; one step down is one row of squares with names).
# Laid out like the operators' Area D overview (Ray, 29 Oct): the UK and St Fergus on
# the left, the Tampen, Nyhamna and Kollsnes corridors in the middle, Kårstø and the
# Norwegian Sea on the right; fields at the top, the hubs below them, the landings
# along the bottom from west to east. Drag a node in the Flow view to move it, and
# Save. A node not listed here is placed by layout.py. `nora validate` checks the ids.

