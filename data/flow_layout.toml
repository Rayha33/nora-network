asgard = [13.6, 1.0]
karsto = [12.6, 1.75]
johan_sverdrup = [11.3, 3.1]
# the hubs, Ekofisk and the southern fields
sleipner = [2.6, 4.5]
gudrun = [0.4, 5.1]  # far left, under Gina Krog, as on Gassco's schematic (Ray, 30 Oct)
gina_krog = [0.2, 4.0]  # far left, level with Sleipner's lines in
draupner_s = [6.6, 4.5]
draupner_e = [8.8, 4.5]
ekofisk = [5.4, 5.15]
valhall = [6.4, 5.9]
